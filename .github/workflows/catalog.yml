name: Refresh orbit catalog

on:
  schedule:
    # Every 3 hours, offset from the top of the hour. A scheduled run leaves a catalog fetched less than 4 hours ago
    # (--if-older-than: it asks CelesTrak nothing), so the catalog is refreshed about every 6 hours, never twice within
    # CelesTrak's 2, and a failed run is followed 3 hours later instead of at the next refresh. GitHub drops
    # scheduled runs (in November 2026 it ran two of the four a day), which a slot every 3 hours absorbs.
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch CelesTrak GP catalog
        # A run started by hand always asks.
        run: npx --yes tsx@4.23.15 scripts/fetch-catalog.ts public/data/catalog.json ${{ github.event_name == 'schedule' && '--if-older-than 4' || '' }}
      - name: Commit catalog
        run: |
          git config user.name "overflight-bot"
          git config user.email "overflight-bot@users.noreply.github.com"
          git add public/data/catalog.json public/data/catalog-names.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "data: refresh orbit catalog"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
